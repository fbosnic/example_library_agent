[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/library_agent"]

[project]
name = "example-library-agent"
version = "0.1.0"
description = "A minimal AI agent example showing what langchain and other tools can do"
readme = "README.md"
license = "MIT"
license_files = ["LICENSE.txt"]
requires-python = ">=3.12"
authors = [
    {name = "Filip Bosnic"}
]

dependencies = [
    "langchain>=0.3.81",
]

[project.optional-dependencies]
dev = [
    "ruff>=14.0",
]
